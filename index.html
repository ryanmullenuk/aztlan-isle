<!doctype html>
<html lang="en" class="splash-open brand-open">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Aztlan Isle: a calm, tactile god game. Guide a tribe settling a lush tropical island." />
    <title>Aztlan Isle</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./icon-32.png?v=4" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=4" />
    <!-- Home screen: icon, full-screen launch and name on iPhone / iPad. -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Overlay iOS status indicators on the game instead of reserving a solid top bar. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aztlan Isle" />
    <meta name="application-name" content="Aztlan Isle" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preload" as="image" href="./redhead-brain.webp" />
    <link rel="preload" as="image" href="./redhead-word.webp" />
    <link rel="preload" as="image" href="./redhead-games.webp" />
    <style>
      /* Inline so the studio splash covers the first paint, before the game bundle loads. */
      html.brand-open, html.brand-open body { margin: 0; background: #000; }
      #studio-splash {
        /* The whole screen from the first paint: not the app height the game measures later. */
        position: fixed; inset: 0; z-index: 10000; background: #000;
        display: grid; place-items: center; opacity: 1;
        transition: opacity 900ms ease; touch-action: none;
      }
      /* Redhead Games: "brain freeze to boom". The two halves of the brain fly in and collide, a
         shockwave rings out, then the name punches in and GAMES opens beneath it. */
      .rh-logo { --rh-red: #ff1a1a; position: relative; width: min(480px, 80vw, 52vh); width: min(480px, 80vw, 52dvh); user-select: none; }
      .rh-logo img { display: block; width: 100%; height: auto; pointer-events: none; }
      .rh-brain-wrap { position: relative; width: 62%; margin: 0 auto; }
      .rh-brain { position: relative; aspect-ratio: 597 / 630; }
      .rh-half { position: absolute; inset: 0; }
      .rh-half img { width: 100%; height: 100%; }
      .rh-left { clip-path: inset(0 49.8% 0 0); }
      .rh-right { clip-path: inset(0 0 0 50.2%); }
      .rh-shock { position: absolute; left: 50%; top: 50%; width: 260%; aspect-ratio: 1; transform: translate(-50%, -50%); pointer-events: none; overflow: visible; z-index: -1; }
      .rh-shock circle { fill: none; stroke: var(--rh-red); transform-origin: 50% 50%; transform-box: fill-box; opacity: 0; }
      .rh-glow { position: absolute; left: 50%; top: 50%; width: 150%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, rgba(255,30,30,.55) 0%, rgba(255,30,30,0) 65%); opacity: 0; pointer-events: none; z-index: -1; }
      .rh-word { margin-top: 3.3%; }
      .rh-games { width: 48.4%; margin: 1.7% auto 0; }
      .rh-logo.rh-play .rh-left { animation: rh-in-left .55s cubic-bezier(.55,0,1,.45) both; }
      .rh-logo.rh-play .rh-right { animation: rh-in-right .55s cubic-bezier(.55,0,1,.45) both; }
      .rh-logo.rh-play .rh-brain { animation: rh-squash .45s .55s cubic-bezier(.3,1.6,.5,1) both; }
      .rh-logo.rh-play .rh-brain-wrap { animation: rh-shake .35s .55s linear both; }
      .rh-logo.rh-play .rh-glow { animation: rh-glow .8s .55s ease-out both; }
      .rh-logo.rh-play .rh-ring1 { animation: rh-ring .9s .55s cubic-bezier(.1,.7,.3,1) forwards; }
      .rh-logo.rh-play .rh-ring2 { animation: rh-ring 1s .68s cubic-bezier(.1,.7,.3,1) forwards; }
      .rh-logo.rh-play .rh-word { animation: rh-punch .6s .8s cubic-bezier(.2,1.5,.4,1) both; }
      .rh-logo.rh-play .rh-games { animation: rh-reveal .55s 1.15s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes rh-in-left { from { transform: translateX(-140%) rotate(-18deg); opacity: 0 } 30% { opacity: 1 } to { transform: none; opacity: 1 } }
      @keyframes rh-in-right { from { transform: translateX(140%) rotate(18deg); opacity: 0 } 30% { opacity: 1 } to { transform: none; opacity: 1 } }
      @keyframes rh-squash { 0% { transform: scale(1.12, .86) } 100% { transform: none } }
      @keyframes rh-shake { 0%, 100% { transform: none } 15% { transform: translate(-6px, 3px) rotate(-1.5deg) } 30% { transform: translate(5px, -4px) rotate(1.2deg) } 45% { transform: translate(-4px, 2px) } 60% { transform: translate(3px, -2px) } 80% { transform: translate(-1px, 1px) } }
      @keyframes rh-glow { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.4) } 20% { opacity: 1 } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.2) } }
      @keyframes rh-ring { 0% { opacity: 1; transform: scale(.15); stroke-width: 14 } 100% { opacity: 0; transform: scale(1); stroke-width: 1 } }
      @keyframes rh-punch { 0% { opacity: 0; transform: scale(2.4); filter: blur(10px) } 60% { opacity: 1; filter: blur(0) } 100% { opacity: 1; transform: none } }
      @keyframes rh-reveal { 0% { opacity: 0; clip-path: inset(0 50% 0 50%); transform: translateY(30%) } 100% { opacity: 1; clip-path: inset(0 0 0 0); transform: none } }
      /* Hidden until the images are in and it plays, so nothing flashes. */
      .rh-logo:not(.rh-play) .rh-half, .rh-logo:not(.rh-play) .rh-word, .rh-logo:not(.rh-play) .rh-games { opacity: 0; }
      @media (prefers-reduced-motion: reduce) { .rh-logo * { animation: none !important; opacity: 1 !important; } }
      #studio-splash.leaving { opacity: 0; }
      @media (prefers-reduced-motion: reduce) { #studio-splash { transition: none; } }
    </style>
    <script>
      // Inside the iOS app (Capacitor injects its bridge before the page runs): no browser-only hints.
      if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) document.documentElement.classList.add('native-app');
    </script>
    <script>
      // Each release replaces the game files, so a cached copy of this page (browsers keep it for a
      // while, home-screen apps longer) can point at files that no longer exist. If one fails to
      // load, or the game hasn't started after a while, fetch the page afresh once rather than hang
      // on the splash; after that, offer a retry.
      (function () {
        var KEY = 'aztlan-isle-reloaded';
        function fresh() {
          try {
            if (sessionStorage.getItem(KEY)) return false;
            sessionStorage.setItem(KEY, '1');
          } catch (e) {
            /* no session storage: still try once */
          }
          var u = new URL(location.href);
          u.searchParams.set('r', Date.now().toString(36));
          location.replace(u.href);
          return true;
        }
        function stuck() {
          if (window.aztlanBooted || window.aztlanBootError || fresh()) return;
          var t = document.getElementById('loading-text');
          var pr = document.getElementById('splash-progress');
          if (pr) pr.classList.add('hidden');
          if (t) {
            t.classList.remove('hidden');
            t.textContent = 'The island could not load. Tap to try again.';
            t.style.cursor = 'pointer';
            t.onclick = function () { location.reload(); };
          }
        }
        window.addEventListener('error', function (e) {
          var el = e.target;
          if (el && (el.tagName === 'SCRIPT' || el.tagName === 'LINK') && /\/assets\//.test(el.src || el.href || '')) stuck();
        }, true);
        setTimeout(stuck, 30000);
      })();
    </script>
  </head>
  <body>
    <div id="studio-splash" role="img" aria-label="Redhead Games">
      <div class="rh-logo" aria-hidden="true">
        <div class="rh-brain-wrap">
          <div class="rh-glow"></div>
          <svg class="rh-shock" viewBox="0 0 100 100"><circle class="rh-ring1" cx="50" cy="50" r="48"/><circle class="rh-ring2" cx="50" cy="50" r="48"/></svg>
          <div class="rh-brain">
            <div class="rh-half rh-left"><img src="./redhead-brain.webp" alt="" fetchpriority="high" /></div>
            <div class="rh-half rh-right"><img src="./redhead-brain.webp" alt="" fetchpriority="high" /></div>
          </div>
        </div>
        <img class="rh-word" src="./redhead-word.webp" alt="" fetchpriority="high" />
        <img class="rh-games" src="./redhead-games.webp" alt="" fetchpriority="high" />
      </div>
    </div>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <div id="loading">
      <div class="splash-frame">
        <picture class="splash-picture">
          <source media="(min-width: 1024px) and (min-aspect-ratio: 4/3)" srcset="./splash-desktop.webp?v=2" type="image/webp" />
          <img class="splash-art" src="./splash.webp?v=6" alt="Aztlan Isle" />
        </picture>
        <div class="splash-figures" aria-hidden="true"></div>
        <div class="splash-shimmer" aria-hidden="true"><i></i></div>
        <canvas class="splash-pollen" aria-hidden="true"></canvas>
        <div class="splash-ui">
          <div class="loading-sub hidden" id="loading-text">Shaping the island…</div>
          <div class="splash-progress" id="splash-progress" role="progressbar" aria-label="Preparing your island" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="sp-head"><span>Preparing your island</span><span class="sp-pct">0%</span></div>
            <div class="sp-bar"><div class="sp-fill"></div></div>
            <p class="sp-tip">Every great civilisation begins with a single settlement.</p>
          </div>
          <button id="play-btn" class="play hidden">Play</button>
          <p class="splash-tips hidden" id="splash-tips" aria-live="polite"></p>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var splash = document.getElementById('studio-splash');
        var mark = splash.querySelector('.rh-logo');
        var parts = Array.prototype.slice.call(splash.querySelectorAll('img'));
        var title = document.querySelector('.splash-art');
        var started = false;
        function ready(image) {
          if (image.complete) return Promise.resolve();
          return new Promise(function (resolve) {
            image.addEventListener('load', resolve, { once: true });
            image.addEventListener('error', resolve, { once: true });
          });
        }
        function remove() {
          splash.remove();
          document.documentElement.classList.remove('brand-open');
        }
        function fade() {
          if (started) return;
          started = true;
          splash.classList.add('leaving');
          splash.addEventListener('transitionend', remove, { once: true });
          setTimeout(remove, 1000);
        }
        // Keep this independent of game boot so a loading error never traps the player.
        Promise.all([
          // Once its pictures are in, the logo plays (about 1.7 s) and holds a moment.
          Promise.all(parts.map(ready)).then(function () {
            mark.classList.add('rh-play');
            return new Promise(function (resolve) { setTimeout(resolve, 2900); });
          }),
          ready(title)
        ]).then(fade);
        setTimeout(fade, 8000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
